set -g mouse on
bind r source-file ~/.tmux.conf
set-option -a terminal-features 'xterm*:RGB'
# Extended keys so TUIs (omo, nvim) receive Shift+Enter and other modified keys
set -g extended-keys on
set -g extended-keys-format csi-u
set-option -a terminal-features 'xterm*:extkeys'
set-option -sg escape-time 10
set-option -g focus-events on
set-window-option -g mode-keys vi
set-option -g renumber-windows on
# Allow passthrough
set -gq allow-passthrough on
set -g visual-activity off

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Key Bindings
# Auto Source tmux.conf
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"


# Set binding for searching with / and ?
bind-key / copy-mode \; send-key ?

# Setting up vi binds for tmux copy mode
bind-key -T copy-mode-vi "v" send-keys -X begin-selection
bind-key -T copy-mode-vi "y" send-keys -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

# Setting up vertical split with |
unbind %
bind | split-window -h -c '#{pane_current_path}'

# Set base index to 1
set -g base-index 1
setw -g pane-base-index 1

# Set kill pane to Shift + Option + X
bind -n M-X kill-pane

# Setting up horizontal split with -
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

unbind 'C'
bind C attach-session -c "#{pane_current_path}"

# Setting up window movement with leader key + Left/Right arrow
bind Left swap-window -t -1\; select-window -t -1
bind Right swap-window -t +1\; select-window -t +1

# Setting up pane resize with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Setting up pane  minimize/maximize with m
bind -r m resize-pane -Z

# Push tmux window/session info to the terminal title
set -g set-titles on
# omo-status puts a coloured marker (@omo_status) in front of the session name;
# focusing the tab clears the attention markers.
set -g set-titles-string "#{?@omo_status,#{@omo_status} ,}#{session_name}"
set-hook -g client-focus-in 'run-shell -b "~/.local/bin/omo-status focus #{q:hook_client}"'
# A tmux client in Herdr gets its session's omo state (OSC 7501) when it attaches
# or switches session.
set-hook -g client-attached 'run-shell -b "~/.local/bin/omo-status sync #{q:hook_client}"'
set-hook -g client-session-changed 'run-shell -b "~/.local/bin/omo-status sync #{q:hook_client}"'
# A session that ends takes the Herdr space omo-status made for it along.
set-hook -g session-closed 'run-shell -b "~/.local/bin/omo-status spaces --local >/dev/null 2>&1"'
# A pane or window that closes can take a reporting omo with it (owt done kills its
# window), so the sessions still reporting an agent work their state out again.
set-hook -g window-unlinked 'run-shell -b "~/.local/bin/omo-status refresh >/dev/null 2>&1"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/omo-status refresh >/dev/null 2>&1"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/omo-status refresh >/dev/null 2>&1"'
# omo on a remote server reports its state in the title of a mosh or ssh pane
# ("omo:<state>:..."); omo-remote turns that into the same ding, marker and banner.
set-hook -g pane-title-changed 'if -F "#{&&:#{m:*omo:*,#{pane_title}},#{||:#{==:#{pane_current_command},mosh-client},#{==:#{pane_current_command},ssh}}}" "run-shell -b \"~/.local/bin/omo-remote title #{hook_pane}\""'

# Set plugin manager path before loading plugins
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-dir "~/.tmux/resurrect"
set -g @resurrect-capture-pane-contents 'on'


set -g @sessionx-bind 's'
set -g @sessionx-window-mode 'on'
set -g @sessionx-tree-mode 'off'
set -g status-position top

# Netrunner: the cyberpunk palette of Herdr's netrunner layout
# (.config/herdr-app/themes/netrunner.json). Session cyan (yellow while the prefix
# is held), current window hot pink, folder purple, hot pink active pane border.
set -g status-style "bg=#0a0a14,fg=#d6e4ff"
# tmux keeps status-bg apart from status-style and it wins, so a server that
# once ran catppuccin keeps its #1e1e2e bar unless this is set too.
set -g status-bg "#0a0a14"
set -g status-fg "#d6e4ff"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#[fg=#{?client_prefix,#fcee0a,#00f0ff},bg=#0a0a14] #[fg=#0a0a14,bg=#{?client_prefix,#fcee0a,#00f0ff}] #[fg=#d6e4ff,bg=#1d1838] #S#[fg=#1d1838,bg=#0a0a14] "
set -g status-right "#[fg=#c74ded,bg=#0a0a14] #[fg=#0a0a14,bg=#c74ded] #[fg=#d6e4ff,bg=#1d1838] #{b:pane_current_path}#[fg=#1d1838,bg=#0a0a14] "
set -g window-status-separator ""
set -g window-status-style "fg=#8c90b8,bg=#0a0a14"
# tmux underlines the current window by default
set -g window-status-current-style "fg=#ffffff,bg=#0a0a14"
set -g window-status-activity-style "fg=#d6e4ff,bg=#0a0a14,none"
set -g window-status-format "#[fg=#1d1838,bg=#0a0a14]#[fg=#8c90b8,bg=#1d1838]#W#[fg=#3b3370,bg=#1d1838] █#[fg=#d6e4ff,bg=#3b3370]#I#[fg=#3b3370,bg=#0a0a14] "
set -g window-status-current-format "#[fg=#0a0a14,bg=#0a0a14]#[fg=#ffffff,bg=#0a0a14,bold]#W#{?window_zoomed_flag,(),}#[fg=#ff2a6d,bg=#0a0a14,nobold] █#[fg=#0a0a14,bg=#ff2a6d,bold]#I#[fg=#ff2a6d,bg=#0a0a14,nobold] "
set -g pane-border-style "fg=#2b2350"
set -g pane-active-border-style "fg=#ff2a6d"
set -g message-style "fg=#00f0ff,bg=#1d1838,align=centre"
set -g message-command-style "fg=#00f0ff,bg=#1d1838,align=centre"
set -g mode-style "fg=#fcee0a,bg=#3a1a4f,bold"
set -g clock-mode-colour "#00f0ff"

# for neovim
set -g @resurrect-strategy-nvim 'session'
set -g @continuum-restore 'on'

# Is VIM?
# TMUX Navigation

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf|pipenv)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# Clipboard (OSC 52)
# Required for nested tmux (local tmux -> ssh/mosh -> remote tmux): the inner
# tmux sends its copies up as OSC 52, and tmux only accepts OSC 52 coming
# from a pane when set-clipboard is "on". The default "external" drops it.
set -g set-clipboard on
set -as terminal-features ',*:clipboard'

# Ctrl+click a file path in any pane (omo, shell, logs) to open it:
# markdown in Markdown Preview, images/pdf/dirs in yazi, the rest in nvim.
# yazi and nvim split beside the clicked pane. In a Herdr terminal, markdown,
# images, pdf and documents open in Herdr's preview instead (the client pid tells).
# See ~/.local/bin/tmux-open-path.
bind -n C-MouseDown1Pane run-shell -b "~/.local/bin/tmux-open-path #{q:pane_id} #{q:pane_current_path} #{mouse_x} #{q:mouse_line} #{client_pid}"

#
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
