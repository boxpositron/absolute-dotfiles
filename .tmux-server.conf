# tmux Server Configuration
# Minimal, plugin-free config optimized for remote servers
# Prefix: Ctrl+/ (sends C-_)
# Status bar: Bottom

# =============================================================================
# Core Settings
# =============================================================================

set -g mouse on
set-option -a terminal-features 'xterm*:RGB'
set-option -sg escape-time 10
set-option -g focus-events on

# Modified keys (Shift+Enter, ...) for Pi/omo; Pi works best with csi-u
set -g extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features ',*:extkeys'
set-window-option -g mode-keys vi
set-option -g renumber-windows on
set -g visual-activity off

set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Set base index to 1
set -g base-index 1
setw -g pane-base-index 1

# =============================================================================
# omo in Herdr
# =============================================================================

# The Mac's Herdr reaches this server as a machine. A tmux client in a Herdr
# terminal gets its session's omo state (OSC 7501) from ~/.local/bin/omo-status,
# a link to this repo's, when it attaches; looking at a pane clears its
# finished or waiting state, as on the Mac.
set-hook -g client-attached 'run-shell -b "~/.local/bin/omo-status sync #{q:hook_client}"'
set-hook -g client-session-changed 'run-shell -b "~/.local/bin/omo-status sync #{q:hook_client}"'
set-hook -g client-focus-in 'run-shell -b "~/.local/bin/omo-status focus #{q:hook_client}"'
# A pane or window that closes can take a reporting omo with it (owt done kills its
# window), so the sessions still reporting an agent work their state out again.
set-hook -g window-unlinked 'run-shell -b "~/.local/bin/omo-status refresh >/dev/null 2>&1"'
set-hook -g pane-exited 'run-shell -b "~/.local/bin/omo-status refresh >/dev/null 2>&1"'
set-hook -g after-kill-pane 'run-shell -b "~/.local/bin/omo-status refresh >/dev/null 2>&1"'

# =============================================================================
# Prefix Key: Ctrl+/ (which sends C-_)
# =============================================================================

set -g prefix C-_
unbind C-b
bind C-_ send-prefix

# =============================================================================
# Status Bar - Bottom Position
# =============================================================================

set -g status-position bottom
set -g status-interval 5
set -g status-justify left

# Simple, readable status bar colors
set -g status-style 'bg=#1e1e2e fg=#cdd6f4'
set -g status-left-length 30
set -g status-right-length 50

set -g status-left '#[fg=#1e1e2e,bg=#89b4fa,bold] #S #[fg=#89b4fa,bg=#1e1e2e]'
set -g status-right '#[fg=#6c7086]#H #[fg=#89b4fa]%H:%M '

# Window status
set -g window-status-format '#[fg=#6c7086] #I:#W '
set -g window-status-current-format '#[fg=#1e1e2e,bg=#a6e3a1,bold] #I:#W#{?window_zoomed_flag,(),} '
set -g window-status-separator ''

# Pane borders
set -g pane-border-style 'fg=#313244'
set -g pane-active-border-style 'fg=#89b4fa'

# Message style
set -g message-style 'bg=#89b4fa fg=#1e1e2e bold'

# =============================================================================
# Key Bindings
# =============================================================================

# Reload config
unbind r
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Search with / and ?
bind-key / copy-mode \; send-key ?

# Vi copy mode bindings
bind-key -T copy-mode-vi "v" send-keys -X begin-selection
bind-key -T copy-mode-vi "y" send-keys -X copy-pipe
# Mouse drag-select copies (keeps selection, stays in copy-mode) -- see Clipboard section
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear

# Split panes with | and -
unbind %
bind | split-window -h -c '#{pane_current_path}'
unbind '"'
bind - split-window -v -c '#{pane_current_path}'

# Kill pane with Shift + Option + X
bind -n M-X kill-pane

# Attach session to current path
unbind 'C'
bind C attach-session -c "#{pane_current_path}"

# Window movement with Left/Right arrows
bind Left swap-window -t -1\; select-window -t -1
bind Right swap-window -t +1\; select-window -t +1

# Pane resize with hjkl
bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

# Pane minimize/maximize with m
bind -r m resize-pane -Z

# =============================================================================
# Pane Navigation (vim-style without plugin)
# =============================================================================

# Smart pane switching with awareness of Vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# =============================================================================
# Clipboard (OSC 52 -> your local machine's clipboard over SSH)
# =============================================================================
# This box is headless (no DISPLAY/Wayland), so xclip/xsel cannot help.
# OSC 52 hands the copied text to the terminal emulator on the other end of
# the SSH connection, which puts it on the real system clipboard.

# "external" (the default) only forwards OSC 52 from programs inside panes.
# "on" additionally makes tmux's own copy commands set the clipboard.
set -g set-clipboard on

# tmux sends its OSC 52 with a blank clipboard name, which mosh drops, so the
# copy keys below also pipe each copy to tmux-osc52, which writes it to the
# client terminals in the form mosh passes on (ESC]52;c;...).
set -s copy-command '~/.local/bin/tmux-osc52'

# tmux only emits OSC 52 for terminals it believes support it. Inside tmux
# TERM is tmux-256color, so advertise the capability for every terminal.
set -as terminal-features ',*:clipboard'

# Let programs in a pane (nvim's OSC 52 provider, imgcat, ...) pass their own
# escape sequences straight through to the outer terminal.
set -gq allow-passthrough on

# In copy-mode: v starts a selection, y copies and stays, Y copies and exits.
# Both now land on the local clipboard as well as the tmux buffer.
# prefix-] pastes the tmux buffer back into a pane.
bind-key -T copy-mode-vi Y send-keys -X copy-pipe-and-cancel
